name: Docker Grupo 20

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verificar-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Verificar Docker
        run: |
          docker --version
          docker compose version

      - name: Construir y ejecutar contenedores
        run: docker compose up -d --build --wait

      - name: Verificar contenedores
        run: docker compose ps

      - name: Verificar aplicacion Streamlit
        run: |
          curl --fail --retry 20 --retry-delay 5 --retry-connrefused http://localhost:8501/_stcore/health

      - name: Mostrar registros
        if: always()
        run: docker compose logs

      - name: Detener contenedores
        if: always()
        run: docker compose down
